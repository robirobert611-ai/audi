<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<title>Audi 3D Showcase</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; overflow:hidden; background:#000; font-family:Arial; }
#ui {
  position: absolute; top:10px; left:50%; transform:translateX(-50%);
  color:#fff; background:rgba(0,0,0,.5); padding:10px 14px; border-radius:8px;
  z-index:10; text-align:center;
}
#ui b { color:#e50914; }
</style>
</head>
<body>

<div id="ui">
  <b>Audi 3D</b><br>
  Trage cu mouse-ul / degetul • Scroll = zoom
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/RGBELoader.js"></script>

<script>
const scene = new THREE.Scene();

// Cameră
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(6, 3, 10);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

// Controale
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Lumină HDR (realism)
new THREE.RGBELoader()
  .setPath('https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/')
  .load('studio_small_08_1k.hdr', (hdr) => {
    hdr.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = hdr;
    scene.background = hdr;
  });

// Sol
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50,50),
  new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.6 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// ===== MODELE AUDI (LINKURI LEGALE) =====
// Poți schimba linkurile cu orice model Audi CC
const cars = [
  {
    url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMilkTruck/glTF/CesiumMilkTruck.gltf",
    pos: [-4,0,0], scale:1.2
  },
  {
    url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMilkTruck/glTF/CesiumMilkTruck.gltf",
    pos: [0,0,0], scale:1.2
  },
  {
    url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMilkTruck/glTF/CesiumMilkTruck.gltf",
    pos: [4,0,0], scale:1.2
  }
];

// Loader
const loader = new THREE.GLTFLoader();
cars.forEach(c => {
  loader.load(c.url, (gltf) => {
    const model = gltf.scene;
    model.position.set(...c.pos);
    model.scale.setScalar(c.scale);
    scene.add(model);
  });
});

// Animație
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
